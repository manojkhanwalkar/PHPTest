# Security settings layered on top of the php:8.4-apache defaults.

ServerName localhost

# Don't advertise the Apache/OS version in headers or error pages.
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Drop slow or stalled clients instead of tying up workers (slowloris).
Timeout 30
KeepAliveTimeout 5
RequestReadTimeout handshake=5 header=10-20,MinRate=500 body=10,MinRate=500

# Bound request sizes.
LimitRequestBody 1048576
LimitRequestFields 50
LimitRequestFieldSize 8190
LimitRequestLine 8190

<Directory /var/www/html>
    Options None
    AllowOverride None
    Require all granted
</Directory>

Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "DENY"
Header always set Content-Security-Policy "default-src 'none'; frame-ancestors 'none'"
Header always set Referrer-Policy "no-referrer"
