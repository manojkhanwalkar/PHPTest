# TLS-terminating reverse proxy in front of Apache: absorbs connection floods (event-driven, cheap
# per idle connection) and enforces per-client limits before anything reaches Apache.

worker_processes auto;
worker_rlimit_nofile 65536;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 16384;
}

http {
    server_tokens off;
    access_log /dev/stdout;

    # Writable paths live on tmpfs (the root filesystem is read-only).
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    # Close slow or idle clients quickly (slowloris).
    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          10s;
    keepalive_timeout     5s;
    reset_timedout_connection on;

    client_max_body_size        1m;
    large_client_header_buffers 4 8k;

    # Per-client-IP limits: concurrent requests and request rate.
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
    limit_req_zone  $binary_remote_addr zone=req_per_ip:10m rate=20r/s;
    limit_conn_status 429;
    limit_req_status  429;

    upstream app {
        server 127.0.0.1:8000;  # Apache, same network namespace
        keepalive 16;
    }

    server {
        # One port, TLS only. Plain-HTTP requests to it get nginx's internal 497
        # error, which is turned into a redirect to the same URL over HTTPS. $http_host
        # keeps the host:port the client used (the published port, not 8443).
        listen 8443 ssl;
        http2 on;
        error_page 497 =301 https://$http_host$request_uri;

        # Certificate and key are mounted at run time (see container.sh), never baked in.
        ssl_certificate     /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;

        # Mozilla "intermediate" profile: TLS 1.2 + 1.3, forward-secret AEAD ciphers.
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Enable HSTS once this is served on a real hostname. It is left off here
        # because browsers apply it to every port on "localhost", which would force
        # HTTPS on unrelated local dev servers.
        # add_header Strict-Transport-Security "max-age=63072000" always;

        limit_conn conn_per_ip 20;
        limit_req  zone=req_per_ip burst=40 nodelay;

        location / {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
            proxy_send_timeout    30s;
        }
    }
}
